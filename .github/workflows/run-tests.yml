name: Run CANE-2 Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout your code repository
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run test_all.sh script
      run: |
        chmod +x tests/run_all.sh
        ./tests/run_all.sh
